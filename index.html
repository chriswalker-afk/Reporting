<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#82052f">
  <link rel="icon" type="image/webp" href="./v2/assets/jis-crest.webp">
  <title>JIS Hub · V2 Preview</title>
  <link rel="stylesheet" href="./v2/hub.css">
  <link rel="stylesheet" href="./v2/responsive-workspace.css">
</head>
<body>
  <a class="skip-link" href="#workspace">Skip to workspace</a>
  <div id="app" class="app-shell">
    <div id="navigation-backdrop" class="navigation-backdrop" data-action="close-menu" aria-hidden="true" hidden></div>
    <aside id="sidebar" class="sidebar" aria-label="Navigation"></aside>
    <div class="app-main">
      <header id="topbar" class="topbar"></header>
      <main id="workspace" class="workspace" tabindex="-1">
        <p class="loading">Loading fictional school records…</p>
      </main>
      <footer class="demo-footer"><span>V2 demo · Fictional data only · Not a secure school system</span><div class="footer-actions"><button class="inline-link" type="button" data-action="demo-guide">Demo guide</button><button class="inline-link" type="button" data-action="reset-demo">Reset demo data</button></div></footer>
    </div>
  </div>
  <dialog id="search-dialog" class="search-dialog" aria-labelledby="search-title"></dialog>
  <dialog id="detail-dialog" class="detail-dialog" aria-labelledby="detail-title"></dialog>
  <dialog id="reset-dialog" class="confirm-dialog" aria-labelledby="reset-title"></dialog>
  <div id="tooltip" class="floating-tooltip" role="tooltip" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript>JavaScript is required to run this fictional-data prototype.</noscript>
  <script type="module" src="./v2/hub.mjs"></script>
</body>
</html>
