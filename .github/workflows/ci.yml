name: Prototype checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check data.js
          node --check assessment-core.js
          node --check classroom.js
          node --check app.js
          node --check tests/fixture.test.cjs
      - name: Run fixture tests
        run: node --test tests/*.test.cjs
