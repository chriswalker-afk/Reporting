name: Prototype checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check data.js
          node --check assessment-core.js
          node --check classroom.js
          node --check access.js
          node --check support-core.js
          node --check support-ui.js
          node --check app.js
          node --check tests/fixture.test.cjs
          for file in v2/*.mjs tests/v2-*.test.mjs; do node --check "$file"; done
      - name: Run legacy and V2 foundation tests
        run: node --test tests/*.test.cjs tests/v2-*.test.mjs

      - name: Validate browser smoke script
        run: node --check tests/browser-smoke.mjs
      - name: Browser integration and responsive smoke test
        run: node tests/browser-smoke.mjs
